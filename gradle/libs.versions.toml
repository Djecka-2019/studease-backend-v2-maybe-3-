# Version catalog for the studease backend.
# Starter versions are managed by the Spring Boot BOM (via the spring-dependency-management
# plugin), so only libraries that are NOT in the BOM carry an explicit version here.

[versions]
spring-boot = "3.3.5"
spring-dependency-management = "1.1.7"
spring-ai = "1.0.0"
spotless = "7.0.2"
mapstruct = "1.6.2"
lombok-mapstruct-binding = "0.2.0"
jjwt = "0.9.1"
jaxb-api = "2.3.1"

[libraries]
# --- BOM-managed (no version) ---
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
postgresql = { module = "org.postgresql:postgresql" }
lombok = { module = "org.projectlombok:lombok" }

# --- spring-ai BOM-managed (no version) ---
spring-ai-starter-model-openai = { module = "org.springframework.ai:spring-ai-starter-model-openai" }

# --- explicitly versioned ---
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
jjwt = { module = "io.jsonwebtoken:jjwt", version.ref = "jjwt" }
jaxb-api = { module = "javax.xml.bind:jaxb-api", version.ref = "jaxb-api" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
