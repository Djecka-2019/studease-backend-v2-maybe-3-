# Test-only configuration: keeps the Spring context self-contained so `contextLoads`
# runs without external Postgres / OpenAI. Replace with Testcontainers in Phase 5.

spring.datasource.url=jdbc:h2:mem:studease;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.ai.openai.api-key=test-key

app.jwt.secret=test-secret-please-change-0123456789abcdef0123456789abcdef
app.jwt.expiration=86400000

app.admin.email=admin@test.local
app.admin.password=admin-test-password

app.cors.allowed-origin-patterns=http://localhost:3000

app.rate-limit.enabled=false
