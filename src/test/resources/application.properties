spring.datasource.url=jdbc:h2:mem:studease;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
# The changelog is PostgreSQL-specific (partial indexes, IDENTITY syntax); the fast H2
# slices keep the Hibernate-generated schema. Migration fidelity is covered by the
# Testcontainers tests, which run Liquibase and then ddl-auto=validate against it.
spring.liquibase.enabled=false

spring.ai.openai.api-key=test-key

app.jwt.secret=test-secret-please-change-0123456789abcdef0123456789abcdef
app.jwt.expiration=86400000

app.admin.email=admin@test.local
app.admin.password=admin-test-password

app.cors.allowed-origin-patterns=http://localhost:3000

app.rate-limit.enabled=false
