spring.application.name=studease-backend

# Strict-by-default: local dev / IDE runs override with SPRING_PROFILES_ACTIVE=dev.
spring.profiles.default=prod

spring.ai.openai.api-key=${OPENAI_API_KEY}
# gpt-4o-turbo, gpt-4o, gpt-4o-mini, gpt-3.5-turbo
spring.ai.openai.chat.options.model=gpt-4o

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.auth-per-minute=${APP_RATE_LIMIT_AUTH_PER_MINUTE:10}
app.rate-limit.student-per-minute=${APP_RATE_LIMIT_STUDENT_PER_MINUTE:60}
app.rate-limit.ai-generate-per-hour=${APP_RATE_LIMIT_AI_PER_HOUR:30}

# How often running test sessions are reconciled against the clock (timer resync + expiry).
app.test-session.sweep-interval-ms=${APP_TEST_SESSION_SWEEP_INTERVAL_MS:15000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5

server.forward-headers-strategy=framework

server.tomcat.connection-timeout=20s
server.tomcat.keep-alive-timeout=15s
server.tomcat.max-keep-alive-requests=100
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator on a dedicated internal port (not published by the compose file).
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
